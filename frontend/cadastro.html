<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saúde Fácil – Criar conta</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="logo-topo">
  <div class="icone">🏥</div>
  <h1>Criar conta</h1>
  <p>Leva menos de um minuto</p>
</div>
<main class="auth-main">
  <div class="card">
    <div id="msg"></div>
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" placeholder="Seu nome">
    <label for="cpf">CPF</label>
    <input type="text" id="cpf" placeholder="000.000.000-00">
    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com">
    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" placeholder="(11) 90000-0000">
    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="••••••">
    <button onclick="cadastrar()">Criar conta</button>
    <button class="texto" onclick="window.location.href='index.html'">Já tenho conta</button>
  </div>
</main>
<script src="js/api.js"></script>
<script>
async function cadastrar() {
  const dados = {
    nome: document.getElementById('nome').value.trim(),
    cpf: document.getElementById('cpf').value.trim(),
    email: document.getElementById('email').value.trim(),
    telefone: document.getElementById('telefone').value.trim(),
    senha: document.getElementById('senha').value.trim(),
  };
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  try {
    await Api.cadastrarUsuario(dados);
    msg.innerHTML = '<div class="sucesso">Conta criada! Redirecionando para o login...</div>';
    setTimeout(() => window.location.href = 'index.html', 1200);
  } catch (e) {
    msg.innerHTML = `<div class="erro">${e.message}</div>`;
  }
}
</script>
</body>
</html>
