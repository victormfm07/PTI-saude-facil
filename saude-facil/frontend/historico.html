<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saúde Fácil – Histórico</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo"><h1>Meus agendamentos</h1></header>
<main>
  <div class="card">
    <div id="lista" class="muted">Carregando...</div>
  </div>
</main>
<nav class="nav-inferior">
  <a href="home.html">🏠<br>Início</a>
  <a href="unidades.html">🔎<br>Unidades</a>
  <a href="agendamento.html">📅<br>Agendar</a>
  <a href="historico.html" class="ativo">🗂️<br>Histórico</a>
</nav>
<script src="js/api.js"></script>
<script>
exigirLogin();
const usuario = usuarioLogado();

async function carregar() {
  const lista = document.getElementById('lista');
  try {
    const agendamentos = await Api.listarAgendamentos(usuario.id);
    if (!agendamentos.length) {
      lista.innerHTML = '<p class="muted">Nenhum agendamento realizado ainda.</p>';
      return;
    }
    lista.innerHTML = agendamentos.map(a => `
      <div class="unidade-item">
        <strong>${a.unidade_nome}</strong>
        <span class="badge ${a.status === 'AGENDADO' ? 'agendado' : 'cancelado'}">${a.status}</span>
        <div class="muted">${a.especialidade}</div>
        <div class="muted">📅 ${a.data_consulta} às ${a.horario_consulta}</div>
        ${a.status === 'AGENDADO' ? `<button class="perigo" onclick="cancelar(${a.id})">Cancelar</button>` : ''}
      </div>
    `).join('');
  } catch (e) {
    lista.innerHTML = `<div class="erro">${e.message}</div>`;
  }
}

async function cancelar(id) {
  await Api.cancelarAgendamento(id);
  carregar();
}

carregar();
</script>
</body>
</html>
