<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saúde Fácil – Unidades</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topo">
  <h1>Buscar unidade</h1>
</header>
<main>
  <div class="card">
    <label for="busca">Bairro, nome ou especialidade</label>
    <input id="busca" placeholder="Ex: Vila Mariana, Pediatria..." oninput="renderizar()">
    <label for="filtro-tipo">Tipo</label>
    <select id="filtro-tipo" onchange="renderizar()">
      <option value="">Todos</option>
      <option value="UBS">UBS</option>
      <option value="UPA">UPA</option>
      <option value="Hospital">Hospital</option>
    </select>
  </div>
  <div class="card">
    <div id="lista" class="muted">Carregando unidades...</div>
  </div>
</main>
<nav class="nav-inferior">
  <a href="home.html">🏠<br>Início</a>
  <a href="unidades.html" class="ativo">🔎<br>Unidades</a>
  <a href="agendamento.html">📅<br>Agendar</a>
  <a href="historico.html">🗂️<br>Histórico</a>
</nav>
<script src="js/api.js"></script>
<script>
exigirLogin();
let unidades = [];

async function carregar() {
  try {
    unidades = await Api.listarUnidades();
    renderizar();
  } catch (e) {
    document.getElementById('lista').innerHTML = `<div class="erro">${e.message}</div>`;
  }
}

function renderizar() {
  const termo = document.getElementById('busca').value.toLowerCase();
  const tipo = document.getElementById('filtro-tipo').value;
  const filtradas = unidades.filter(u =>
    (!tipo || u.tipo === tipo) &&
    (u.nome.toLowerCase().includes(termo) ||
     u.bairro.toLowerCase().includes(termo) ||
     u.especialidades.toLowerCase().includes(termo))
  );
  const lista = document.getElementById('lista');
  if (!filtradas.length) {
    lista.innerHTML = '<p class="muted">Nenhuma unidade encontrada.</p>';
    return;
  }
  lista.innerHTML = filtradas.map(u => `
    <div class="unidade-item">
      <strong>${u.nome}</strong> <span class="badge agendado">${u.tipo}</span>
      <div class="muted">${u.endereco} — ${u.bairro}</div>
      <div class="muted">Especialidades: ${u.especialidades}</div>
      <div class="muted">Funcionamento: ${u.horario_funcionamento}</div>
    </div>
  `).join('');
}

carregar();
</script>
</body>
</html>
